name: Online Windows Compiler

on:
  workflow_dispatch:

jobs:
  build-windows-cpu:
    name: Build for Windows (CPU-Only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Obliterate DirectX Code base
        run: |
          # Completely empty out the DirectX folder so the compiler cannot build it
          rm -rf src/neural/dx/*
          # Create a blank fallback header so the main compiler doesn't throw a missing file error
          mkdir -p src/neural/dx/shaders
          echo "// Empty fallback" > src/neural/dx/dx_backend.h
          echo "// Empty fallback" > src/neural/dx/network_dx.h

      - name: Create Fake DXC to Bypass Verification
        run: |
          sudo echo '#!/bin/sh' > /usr/local/bin/dxc
          sudo echo 'exit 0' >> /usr/local/bin/dxc
          sudo chmod +x /usr/local/bin/dxc

      - name: Configure and Compile Windows Executable
        run: |
          # Build a clean cross-file profile with zero custom option variables
          cat <<EOF > cross_win.txt
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkg-config = 'false'

          [built-in options]
          cpp_std = 'c++17'
          cpp_args = ['-fpermissive', '-Wno-error']
          c_args = ['-Wno-error']
          EOF
          
          meson setup build --cross-file cross_win.txt --buildtype=release
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows-cpu
          path: build/lc0.exe

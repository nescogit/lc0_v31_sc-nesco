name: Online Multi-Platform Compiler

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          pip install meson ninja

      - name: Install DirectX Shader Compiler (dxc)
        run: |
          Invoke-WebRequest -Uri "https://github.com" -OutFile "dxc.zip"
          Expand-Archive -Path "dxc.zip" -DestinationPath "dxc_extracted"
          # Add the dxc binary directory to the system PATH so Meson can find it
          echo "$PWD\dxc_extracted\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure and Compile
        run: |
          meson setup build --buildtype=release
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows
          path: build/lc0.exe

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgoogle-perftools-dev libprotobuf-dev protobuf-compiler libblas-dev liblapack-dev

      - name: Configure and Compile
        run: |
          meson setup build --buildtype=release
          ninja -C build

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-linux
          path: build/lc0

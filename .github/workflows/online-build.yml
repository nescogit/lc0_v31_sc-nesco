name: Online Multi-Platform Compiler

on:
  workflow_dispatch:

jobs:
  build-linux-cpu:
    name: Build for Linux (CPU)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgoogle-perftools-dev libprotobuf-dev protobuf-compiler libblas-dev liblapack-dev

      - name: Configure and Compile
        run: |
          meson setup build --buildtype=release
          ninja -C build

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-linux-cpu
          path: build/lc0

  build-windows-cross:
    name: Build for Windows (Cross-Compiled CPU)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Configure and Compile
        run: |
          # Force the project options directly inside the cross-compilation file to disable DX12/OpenCL
          cat <<EOF > cross_win.txt
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'

          [project options]
          blas = true
          opencl = false
          werror = false
          EOF
          
          meson setup build --cross-file cross_win.txt --buildtype=release
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows-cpu
          path: build/lc0.exe

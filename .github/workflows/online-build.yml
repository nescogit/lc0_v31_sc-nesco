name: Online Windows Compiler

on:
  workflow_dispatch:

jobs:
  build-windows-cpu:
    name: Build for Windows (CPU-Only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Surgical Fix of Code and System Dependencies
        run: |
          # 1. Inject the missing Windows 10 CommandList4 and Device5 definitions directly into MinGW's core d3d12 header
          MINGW_D3D12="/usr/share/mingw-w64/include/d3d12.h"
          sudo sed -i 's/ID3D12GraphicsCommandList3/ID3D12GraphicsCommandList4/g' $MINGW_D3D12
          sudo sed -i 's/ID3D12Device4/ID3D12Device5/g' $MINGW_D3D12
          sudo sed -i 's/ID3D12MetaCommand/void/g' $MINGW_D3D12
          
          # 2. Fix the deprecated Microsoft initialization pointer macro call that breaks legacy Leela linking
          find src/ -type f \( -name "*.cc" -o -name "*.h" \) -exec sed -i 's/_get_pgmptr(&_pgmptr)/0/g' {} +
          find src/ -type f \( -name "*.cc" -o -name "*.h" \) -exec sed -i 's/_get_pgmptr/&_fake/g' {} +

      - name: Configure and Compile Windows Executable
        run: |
          # Write the complete cross-file mapping table with windres included
          cat <<EOF > cross_win.txt
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkg-config = 'false'

          [built-in options]
          cpp_std = 'c++17'
          cpp_args = ['-fpermissive', '-Wno-error']
          c_args = ['-Wno-error']
          EOF
          
          meson setup build --cross-file cross_win.txt --buildtype=release
          ninja -C build

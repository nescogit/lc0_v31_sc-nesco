name: Online Windows Compiler

on:
  workflow_dispatch:

jobs:
  build-windows-cpu:
    name: Build for Windows (CPU-Only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Surgical Removal of DirectX from Build System
        run: |
          # 1. Surgically erase the hardcoded DirectX source files from the master compilation list
          sed -i '/network_dx.cc/d' meson.build || true
          sed -i '/shader_wrapper.cc/d' meson.build || true
          sed -i '/layers_dx.cc/d' meson.build || true
          
          # 2. Delete the subdirectory rules that force it to jump into the shader compiler blocks
          sed -i '/src\/neural\/dx/d' meson.build || true
          sed -i '/neural\/dx\/shaders/d' meson.build || true

          # 3. Apply the verified file patch to replace the deprecated _get_pgmptr macro at the source level
          sed -i 's/if (_get_pgmptr(\&_pgmptr) != 0)/if (false)/g' src/utils/filesystem.win32.cc || true

      - name: Configure and Compile Windows Executable
        run: |
          # 4. Write the complete cross-file mapping table with windres included and clean built-in options
          cat <<EOF > cross_win.txt
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkg-config = 'false'

          [built-in options]
          cpp_std = 'c++17'
          cpp_args = ['-fpermissive', '-Wno-error']
          c_args = ['-Wno-error']
          EOF
          
          meson setup build --cross-file cross_win.txt --buildtype=release
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows-cpu
          path: build/lc0.exe

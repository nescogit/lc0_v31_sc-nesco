name: Online Multi-Platform Compiler

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows (OpenCL)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          pip install meson ninja

      - name: Configure and Compile
        run: |
          meson setup build -Dbackend=opencl --buildtype=release -Dwerror=false
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows
          path: build/lc0.exe

  build-linux:
    name: Build for Linux (OpenCL)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgoogle-perftools-dev libprotobuf-dev protobuf-compiler ocl-icd-opencl-dev opencl-headers

      - name: Configure and Compile
        run: |
          meson setup build -Dbackend=opencl --buildtype=release -Dwerror=false
          ninja -C build

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-linux
          path: build/lc0

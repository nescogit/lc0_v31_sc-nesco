name: Online Windows Compiler

on:
  workflow_dispatch:

jobs:
  build-windows-cpu:
    name: Build for Windows (CPU-Only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Locate and Compile Protocol Buffers
        run: |
          # Dynamically search the repository to find exactly where net.proto is located
          PROTO_FILE=$(find . -name "net.proto" -print -quit)
          PROTO_DIR=$(dirname "$PROTO_FILE")
          echo "Found net.proto inside directory: $PROTO_DIR"
          
          # Compile the engine blueprint headers natively using the dynamically discovered path
          protoc --proto_path="$PROTO_DIR" --cpp_out="$PROTO_DIR" "$PROTO_FILE"

      - name: Direct Wildcard Target Compilation
        run: |
          # Use automated find maps to catch every active CPU source file across your codebase
          # This compiles everything cleanly while completely dropping the src/neural/dx graphics directory!
          SRC_FILES=$(find src/ -name "*.cc" ! -path "src/neural/dx/*" ! -path "src/benchmark/*" ! -path "src/lc0ctl/*" ! -path "src/selfplay/*" ! -path "src/trainingdata/*" ! -path "src/syzygy/*")
          PROTO_CC=$(find . -name "*.pb.cc")
          
          echo "Compiling files: $SRC_FILES $PROTO_CC"
          
          # Run the raw independent cross-compiler natively with lenient legacy flags
          x86_64-w64-mingw32-g++ -std=c++17 -O3 -march=native -DNOMINMAX -DNO_PEXT -pthread -fpermissive \
            -Isrc \
            -Ithird_party \
            -I. \
            $SRC_FILES \
            $PROTO_CC \
            -lws2_32 -lwinmm \
            -o lc0.exe

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows-cpu
          path: lc0.exe

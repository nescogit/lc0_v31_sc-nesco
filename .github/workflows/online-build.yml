name: Online Windows Compiler

on:
  workflow_dispatch:

jobs:
  build-windows-cpu:
    name: Build for Windows (CPU-Only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Comment Out DirectX Subdir Commands From Root Config
        run: |
          # Use sed to target and cleanly comment out any subdirectory jumps to dx graphics
          sed -i '/src\/neural\/dx/s/^/#/' meson.build
          sed -i '/neural\/dx\/shaders/s/^/#/' meson.build

      - name: Configure and Compile Windows Executable
        run: |
          # Force the compiler parameters natively with zero custom flags
          cat <<EOF > cross_win.txt
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkg-config = 'false'

          [built-in options]
          cpp_std = 'c++17'
          cpp_args = ['-fpermissive', '-Wno-error']
          c_args = ['-Wno-error']
          EOF
          
          meson setup build --cross-file cross_win.txt --buildtype=release
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows-cpu
          path: build/lc0.exe

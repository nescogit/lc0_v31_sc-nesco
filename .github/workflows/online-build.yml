name: Online Windows Compiler

on:
  workflow_dispatch:

jobs:
  build-windows-cpu:
    name: Build for Windows (CPU-Only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Cross-Compiler Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 g++-mingw-w64 libprotobuf-dev protobuf-compiler

      - name: Surgical Removal of DirectX From Source Manifests
        run: |
          # 1. Comment out the hardcoded DirectX subdirectory include commands from the configuration manifests
          sed -i '/subdir.*neural\/dx/d' meson.build || true
          sed -i '/subdir.*dx\/shaders/d' meson.build || true
          
          # 2. Hard-wipe the inner factory.cc loop so it never triggers the DxNetwork component calls
          sed -i '/#include "neural\/dx\/network_dx.h"/d' src/neural/factory.cc || true
          sed -i '/if (backend == "dx")/,/}/d' src/neural/factory.cc || true
          
          # 3. Clean out the hardcoded filenames from the primary source arrays inside meson.build
          sed -i '/neural\/dx\/network_dx.cc/d' meson.build || true
          sed -i '/neural\/dx\/shader_wrapper.cc/d' meson.build || true
          sed -i '/neural\/dx\/layers_dx.cc/d' meson.build || true

      - name: Configure and Compile Windows Target
        run: |
          # 4. Write the complete cross-file mapping table with windres and the link-time symbol mapping definition included
          cat <<EOF > cross_win.txt
          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'

          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkg-config = 'false'

          [built-in options]
          cpp_std = 'c++17'
          cpp_args = ['-fpermissive', '-Wno-error']
          c_args = ['-Wno-error']
          cpp_link_args = ['-Wl,--defsym,_get_pgmptr=0']
          c_link_args = ['-Wl,--defsym,_get_pgmptr=0']
          EOF
          
          meson setup build --cross-file cross_win.txt --buildtype=release
          ninja -C build

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lc0-search-contempt-windows-cpu
          path: build/lc0.exe
